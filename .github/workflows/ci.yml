# The validate job runs the same command as `just validate`, and the lint job
# calls divbast/ci's lint.yml, which runs `just lint`.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    uses: divbast/ci/.github/workflows/lint.yml@5a35010a14a01aab0f407b98b550cecf0eee2c49 # v5.5.0
    permissions:
      contents: read

  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the presets with Renovate's own validator
        run: docker run --rm -v "$PWD:/w:ro" -w /w ghcr.io/renovatebot/renovate:45.3.2@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb renovate-config-validator --strict --no-global default.json app.json renovate.json

      - name: Check that every matchManagers value names a manager
        run: |
          check=(docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint node ghcr.io/renovatebot/renovate:45.3.2@sha256:d0358088501c7665688673c8932474b02517941703a16e970e8b4fcf235299cb check-managers.js)
          "${check[@]}" default.json app.json renovate.json
          # The check must also fail, naming the value, on each fixture that misspells one
          for fixture in bad-manager:github-action bad-custom-manager:custom.regx; do
            file=test/fixtures/${fixture%%:*}.json
            if out=$("${check[@]}" "${file}" 2>&1) || [[ "${out}" != *"names no manager: ${fixture#*:}"* ]]; then
              printf 'check-managers.js did not reject %s:\n%s\n' "${file}" "${out}" >&2
              exit 1
            fi
          done

  # The one check main's ruleset requires, so the job list can change without
  # touching the ruleset. GitHub counts a skipped required check as passing,
  # so this runs always and treats a skipped or cancelled job as a failure.
  required:
    name: required
    needs: [lint, validate]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [ "${result}" != success ]; then
              echo "a required job ended ${result}" >&2
              exit 1
            fi
          done
