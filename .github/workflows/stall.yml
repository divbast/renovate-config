# The daily stall check, through divbast/ci's stall.yml: a Renovate pull
# request that never goes green or never finishes, or Renovate itself silent.
# This repository publishes nothing, so there is no slots check. A scheduled
# run's failure goes to whoever last edited the cron line below.

name: stall

on:
  schedule:
    # Clear of the other repositories' stall checks, so none start
    # together.
    - cron: '05 12 * * *'
  workflow_dispatch:

permissions: {}

# One run at a time; a second has nothing to add to the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stall:
    name: stall
    uses: divbast/ci/.github/workflows/stall.yml@aad6b008203219be9fa3ffd39696d8ab2f9afedc # v1.26.0
    with:
      checks: '["open","stuck","renovate"]'
    # Everything stall.yml's job asks for, since a called job gets no more
    # than its caller grants, even what a check this job skips would need.
    permissions:
      contents: read # read main, compare commits, the repository's age
      pull-requests: read # list Renovate's pull requests
      actions: read # list the Renovate runs
      checks: read # read each pull request's check runs
      statuses: read # and its commit statuses
      packages: read # tell a private image from an absent one, for slots
